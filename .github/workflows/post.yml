name: Auto-post

on:
  schedule:
    # GitHub only understands UTC, so this wakes up at both the summer and winter
    # UTC equivalents of 8am, noon and 6pm New York. The "due" step below posts only
    # when the New York hour is one of schedule.slots in config.yaml (and picks
    # carousel vs. ad from there), so daylight saving time is handled automatically.
    # (Minute 7 avoids GitHub's busy top-of-hour slot.)
    - cron: "7 12,13,16,17,22,23 * * *"
  workflow_dispatch:          # adds a "Run workflow" button for testing
    inputs:
      kind:
        description: "What to make"
        type: choice
        options: [carousel, ad]
        default: carousel
      dry_run:
        description: "Test only: make the images but DON'T post (scheduled runs always post)"
        type: boolean
        default: false

permissions:
  contents: write             # lets the job commit slides + history back to the repo

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Which keys can this run see? (shows set/MISSING, never the values)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || vars.OPENAI_API_KEY }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN || vars.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || vars.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || vars.IG_USER_ID }}
        run: |
          for k in GEMINI_API_KEY OPENAI_API_KEY META_PAGE_TOKEN FB_PAGE_ID IG_USER_ID; do
            if [ -n "${!k}" ]; then echo "$k: set"; else echo "$k: MISSING"; fi
          done

      - name: Is it a posting hour in New York?
        id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"   # manual runs always go
            echo "kind=${{ inputs.kind }}" >> "$GITHUB_OUTPUT"
          else
            python -m autopost.main due
          fi

      - name: Write post, draw AI image, render
        id: gen
        if: steps.due.outputs.due == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || vars.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN || vars.META_PAGE_TOKEN }}   # to read how past posts performed
        run: python -m autopost.main generate "${{ steps.due.outputs.kind }}"

      - name: Commit images (makes the images publicly reachable for Meta)
        id: commit
        if: steps.due.outputs.due == 'true'
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add posts
          [ -f history.json ] && git add history.json
          git commit -m "New post ${{ steps.gen.outputs.post_id }}"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish to Instagram + Facebook
        if: steps.due.outputs.due == 'true' && !inputs.dry_run
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN || vars.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || vars.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || vars.FB_PAGE_ID }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          sleep 20   # give GitHub's CDN a moment to serve the new images
          python -m autopost.main publish "${{ steps.gen.outputs.post_id }}"

      - name: Save posting history
        if: always() && !inputs.dry_run && steps.commit.outcome == 'success'
        run: |
          git add history.json || true
          git diff --cached --quiet || (git commit -m "Log post ${{ steps.gen.outputs.post_id }}" && git push)
